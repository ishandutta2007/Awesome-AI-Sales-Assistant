<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient (without transparency for high rendering compatibility) -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #c084fc;
      letter-spacing: 0.5px;
    }

    /* Standardized Keyframes */
    @keyframes pulse-glow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    @keyframes float-particle {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-10px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }

    .glowing-orb {
      animation: pulse-glow 6s infinite ease-in-out;
    }

    .p1 { animation: float-particle 4s infinite ease-in-out; }
    .p2 { animation: float-particle 6s infinite ease-in-out; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Background Orbs -->
  <circle class="glowing-orb" cx="150" cy="80" r="140" fill="#4f46e5" opacity="0.3" filter="url(#glow)" />
  <circle class="glowing-orb" cx="1050" cy="260" r="160" fill="#c084fc" opacity="0.25" filter="url(#glow)" />

  <!-- Abstract Curved Waves -->
  <path d="M -100 280 Q 200 180 500 260 T 1100 200 T 1300 290" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.4" />
  <path d="M -100 240 Q 300 310 700 210 T 1300 250" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3" />

  <!-- Subtle Particles -->
  <circle class="p1" cx="220" cy="70" r="4" fill="#a855f7" />
  <circle class="p2" cx="950" cy="90" r="5" fill="#6366f1" />
  <circle class="p1" cx="880" cy="270" r="4" fill="#ec4899" />
  <circle class="p2" cx="120" cy="250" r="4" fill="#38bdf8" />

  <!-- High-Contrast Card Overlay in Foreground -->
  <rect x="50" y="45" width="1100" height="250" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Foreground Content -->
  <g transform="translate(90, 85)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="240" height="32" rx="16" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
    <text x="120" y="21" text-anchor="middle" class="badge-text">REVENUE &amp; SALES AI 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Awesome AI Sales Assistant</text>

    <!-- Gradient Line Accent -->
    <rect x="0" y="105" width="560" height="4" rx="2" fill="url(#accent-grad)" />

    <!-- Subtitle -->
    <text x="0" y="145" class="subtitle">Curated Conversation Intelligence, Sales Coaching &amp; Revenue AI Platforms</text>
  </g>
</svg>
